name: Build Android APK

# Собирает debug-APK приложения StraightUp в облаке GitHub Actions —
# так можно получить готовый .apk без установки Android Studio на своём
# компьютере. Нужен только пуш этого репозитория на GitHub.
#
# Как запустить:
#   1. Создайте пустой репозиторий на GitHub и запушьте в него содержимое
#      этой папки (straightup/) целиком, как есть.
#   2. Откройте вкладку "Actions" в репозитории — сборка запустится сама
#      после пуша (или нажмите "Run workflow" вручную).
#   3. Через 5-10 минут в разделе "Artifacts" завершённого запуска будет
#      файл straightup-debug-apk — скачайте и установите на телефон
#      (в настройках Android разрешите установку из неизвестных источников).
#
# Это debug-сборка (для тестирования на своём телефоне), не подписанная
# для публикации в Google Play — для MVP/демо этого достаточно.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        working-directory: app
        run: npm install

      - name: Generate native Android project from the official RN template
        # Мы не храним android/ в репозитории (это большой сгенерированный
        # Gradle-проект) — вместо этого каждый CI-запуск генерирует его
        # заново той же версией react-native, что в app/package.json, и
        # копирует внутрь. Имя проекта в `init StraightUp` обязано совпадать
        # с "name" в app/app.json — именно это имя зашивается в нативный
        # MainActivity.getMainComponentName() и должно совпадать со
        # строкой в AppRegistry.registerComponent(appName, ...) из index.js.
        working-directory: app
        run: |
          set -e
          RN_VERSION=$(node -p "require('./package.json').dependencies['react-native']")
          echo "react-native version: $RN_VERSION"

          for attempt in 1 2 3; do
            echo "init attempt $attempt"
            rm -rf /tmp/straightup-native
            npx --yes react-native@$RN_VERSION init StraightUp \
              --version $RN_VERSION \
              --package-name com.straightup.app \
              --skip-install \
              --skip-git-init \
              --directory /tmp/straightup-native \
              --pm npm
            if [ -f /tmp/straightup-native/android/app/src/main/AndroidManifest.xml ]; then
              break
            fi
            echo "AndroidManifest.xml missing after init, retrying..."
            find /tmp/straightup-native -maxdepth 3 || true
            if [ "$attempt" = 3 ]; then
              echo "::error::react-native init failed to produce android/app/src/main/AndroidManifest.xml after 3 attempts"
              exit 1
            fi
          done

          # app/android/ already exists in the repo (it holds
          # README_NATIVE_SETUP.md as a placeholder), so `cp -R src dst`
          # would nest the generated tree under android/android instead of
          # merging into it. Copy the *contents* of the source dir instead.
          mkdir -p ./android
          cp -R /tmp/straightup-native/android/. ./android/
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "::error::AndroidManifest.xml missing after copying android/ into app/"
            find android -maxdepth 4 || true
            exit 1
          fi

      - name: Add Bluetooth/vibration permissions to AndroidManifest.xml
        working-directory: app
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "BLUETOOTH_CONNECT" "$MANIFEST"; then
            python3 - "$MANIFEST" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
          )
          marker = "<manifest"
          idx = content.index(marker)
          end = content.index(">", idx) + 1
          content = content[:end] + "\n" + perms + content[end:]
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
          fi
          cat "$MANIFEST"

      - name: Link vector-icon fonts
        working-directory: app
        run: |
          set -e
          GRADLE_FILE=android/app/build.gradle
          LINE='apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")'
          if ! grep -qF "$LINE" "$GRADLE_FILE"; then
            echo "$LINE" >> "$GRADLE_FILE"
          fi

      - name: Bundle JS into the debug APK
        # By default the React Native Gradle plugin treats the "debug"
        # variant as a dev-server build: it skips embedding the JS bundle
        # and expects Metro running on a connected computer, which is why
        # a plain debug APK installed standalone shows "Could not connect
        # to development server." Clearing debuggableVariants makes the
        # debug build embed the JS bundle like a release build would, so
        # the APK works on its own on a phone.
        working-directory: app
        run: |
          set -e
          GRADLE_FILE=android/app/build.gradle
          if ! grep -qE '^[[:space:]]*debuggableVariants[[:space:]]*=' "$GRADLE_FILE"; then
            python3 - "$GRADLE_FILE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          marker = "react {"
          idx = content.index(marker) + len(marker)
          content = content[:idx] + "\n    debuggableVariants = []\n" + content[idx:]
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
          fi
          grep -n "debuggableVariants" "$GRADLE_FILE"

      - name: Increase Gradle JVM heap
        # The template's default org.gradle.jvmargs (-Xmx2048m) has been
        # seen to OOM ("Java heap space") on GitHub-hosted runners while
        # jetifying the hermes-android AAR. Give it more headroom.
        working-directory: app
        run: |
          set -e
          PROPS=android/gradle.properties
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' "$PROPS"
          grep -n "org.gradle.jvmargs" "$PROPS"

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: straightup-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
